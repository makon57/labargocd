apiVersion: v1
kind: Secret
metadata:
  name: cluster-placeholder-install-config
  namespace: cluster-placeholder
stringData:
  install-config.yaml: |
    apiVersion: v1
    baseDomain: openshiftpartnerlabs.com
    metadata:
      name: 4042198f-isarnetvirt

    controlPlane:
      name: master
      platform:
        aws:
          type: c5d.metal
          rootVolume:
            iops: 4000
            size: 120
            type: gp3
          zones:
            - us-east-2a
            - us-east-2b
            - us-east-2c
      replicas: 1

    compute:
      - name: worker
        platform:
          aws:
            type: c5d.metal
            rootVolume:
              iops: 4000
              size: 100
              type: gp3
            zones:
              - us-east-2a
              - us-east-2b
              - us-east-2c
        replicas: 0

    networking:
      clusterNetwork:
        - cidr: 10.128.0.0/14
          hostPrefix: 23
      machineNetwork:
        - cidr: 10.0.0.0/16
      serviceNetwork:
        - 172.30.0.0/16
      networkType: OVNKubernetes

    platform:
      aws:
        region: us-east-2

    fips: false
    publish: External
