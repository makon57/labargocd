apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev-cluster-01

resources:
  - ../../cluster-templates/aws-ha/base
  # Note: Cluster-scoped Crossplane resources (Provider, ProviderConfig)
  # are in bootstrap/ and applied once cluster-wide

patches:
  # Install config secret content - must come before rename
  - path: patches/install-config.yaml

  # Rename ClusterDeployment
  - target:
      kind: ClusterDeployment
      name: cluster-placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01
      - op: replace
        path: /spec/clusterName
        value: dev-cluster-01
      - op: replace
        path: /spec/baseDomain
        value: openshiftpartnerlabs.com
      - op: replace
        path: /spec/platform/aws/region
        value: us-east-1
      - op: replace
        path: /spec/provisioning/imageSetRef/name
        value: img4.20.10-x86-64-appsub
      - op: replace
        path: /spec/provisioning/installConfigSecretRef/name
        value: dev-cluster-01-install-config
      - op: replace
        path: /spec/provisioning/sshPrivateKeySecretRef/name
        value: ssh-key
      - op: remove
        path: /spec/provisioning/manifestsConfigMapRef

  # Rename MachinePool
  - target:
      kind: MachinePool
      name: cluster-placeholder-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01-worker
      - op: replace
        path: /spec/clusterDeploymentRef/name
        value: dev-cluster-01
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/platform/aws/type
        value: m5.2xlarge

  # Rename ManagedCluster
  - target:
      kind: ManagedCluster
      name: cluster-placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01
      - op: add
        path: /metadata/labels/environment
        value: development

  # Rename KlusterletAddonConfig
  - target:
      kind: KlusterletAddonConfig
      name: cluster-placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01
      - op: replace
        path: /spec/clusterName
        value: dev-cluster-01
      - op: replace
        path: /spec/clusterNamespace
        value: dev-cluster-01

  # Rename install-config Secret
  - target:
      kind: Secret
      name: cluster-placeholder-install-config
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01-install-config

  # Fix AccessKey namespace for secret
  - target:
      group: iam.aws.upbound.io
      kind: AccessKey
      name: ocp-installer-access-key
    patch: |-
      - op: replace
        path: /spec/writeConnectionSecretToRef/namespace
        value: dev-cluster-01

  # Rename SSL Job
  - target:
      kind: Job
      name: cluster-placeholder-ssl-setup
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01-ssl-setup

  # Rename SSL ServiceAccount
  - target:
      kind: ServiceAccount
      name: ssl-setup-sa
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-cluster-01

  # Rename SSL ClusterRoleBinding
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: cluster-placeholder-ssl-setup-clusterrolebinding
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01-ssl-setup-clusterrolebinding
      - op: replace
        path: /subjects/0/namespace
        value: dev-cluster-01

  # Rename SSL cleanup Job
  - target:
      kind: Job
      name: cluster-placeholder-ssl-cleanup
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01-ssl-cleanup

  # Rename SSL cleanup ServiceAccount
  - target:
      kind: ServiceAccount
      name: ssl-cleanup-sa
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: dev-cluster-01

  # Rename SSL cleanup ClusterRoleBinding
  - target:
      group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: cluster-placeholder-ssl-cleanup-clusterrolebinding
    patch: |-
      - op: replace
        path: /metadata/name
        value: dev-cluster-01-ssl-cleanup-clusterrolebinding
      - op: replace
        path: /subjects/0/namespace
        value: dev-cluster-01
