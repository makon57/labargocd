apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 2dc91c27-rhsplunk
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-provisioning-argocd
  source:
    repoURL: https://github.com/redhat-openshift-partner-labs/labargocd.git
    targetRevision: main
    path: clusters/2dc91c27-rhsplunk
  destination:
    server: https://kubernetes.default.svc
    namespace: 2dc91c27-rhsplunk
  syncPolicy:
    automated:
      prune: false
      selfHeal: false  # CRITICAL: Must be false to prevent accidental cluster deletion
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: hive.openshift.io
      kind: ClusterDeployment
      jsonPointers:
        - /status
        - /spec/clusterMetadata
        - /spec/installed
    - group: cluster.open-cluster-management.io
      kind: ManagedCluster
      jsonPointers:
        - /status
        - /spec/managedClusterClientConfigs
