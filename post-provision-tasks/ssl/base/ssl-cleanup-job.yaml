---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssl-cleanup-sa
  namespace: cluster-placeholder
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ssl-cleanup-clusterrole
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete", "get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "clusterissuers"]
    verbs: ["delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-placeholder-ssl-cleanup-clusterrolebinding
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ssl-cleanup-clusterrole
subjects:
  - kind: ServiceAccount
    name: ssl-cleanup-sa
    namespace: cluster-placeholder
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-placeholder-ssl-cleanup
  namespace: cluster-placeholder
  annotations:
    argocd.argoproj.io/hook: PreDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        managed-by: argocd
        provisioner: hive
    spec:
      serviceAccountName: ssl-cleanup-sa
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ssl-cleanup
          image: registry.redhat.io/openshift4/ose-cli@sha256:69762925e16053d77685ff3a08b3b45dd2bfa5d68277851bc6969b368bbd0cb9
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              CLUSTER_NAME="${CLUSTER_NAME}"

              echo "=== SSL cleanup for cluster ${CLUSTER_NAME} ==="

              # Delete cluster-specific ClusterIssuer
              echo "Deleting ClusterIssuer: letsencrypt-${CLUSTER_NAME}"
              oc delete clusterissuer "letsencrypt-${CLUSTER_NAME}" --ignore-not-found=true

              # Delete cluster-specific cert-manager secret
              echo "Deleting cert-manager secret: ${CLUSTER_NAME}-cert-manager-aws"
              oc delete secret "${CLUSTER_NAME}-cert-manager-aws" -n openshift-ingress --ignore-not-found=true

              # Delete certificate (it will be recreated if cluster still exists)
              echo "Deleting certificate: ${CLUSTER_NAME}-wildcard-certificate"
              oc delete certificate "${CLUSTER_NAME}-wildcard-certificate" -n openshift-ingress --ignore-not-found=true

              # Delete certificate secret (it will be recreated if cluster still exists)
              echo "Deleting certificate secret: ${CLUSTER_NAME}-wildcard-certificate"
              oc delete secret "${CLUSTER_NAME}-wildcard-certificate" -n openshift-ingress --ignore-not-found=true

              echo "=== SSL cleanup complete for ${CLUSTER_NAME} ==="
          env:
            - name: CLUSTER_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
      volumes:
        - name: tmp-volume
          emptyDir: {}